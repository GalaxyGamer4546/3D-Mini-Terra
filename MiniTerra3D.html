const torchLights = new Map();
const SPAWN_KEY = 'miniterra3d.bedspawn.v1';
let bedSpawnPoint = null;
try {
  const s = JSON.parse(localStorage.getItem(SPAWN_KEY) || 'null');
  if (s && s.x !== undefined) bedSpawnPoint = s;
} catch (e) {}

function addTorchLight(x, y, z) {
  const key = x + ',' + y + ',' + z;
  if (torchLights.has(key)) return;
  const light = new THREE.PointLight(0xffb060, 1.2, 12, 1.5);
  light.position.set(x + 0.5, y + 0.7, z + 0.5);
  const cube = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), new THREE.MeshBasicMaterial({ color: 0xffcc55 }));
  cube.position.copy(light.position);
  light.add(cube);
  scene.add(light);
  torchLights.set(key, light);
}
function removeTorchLight(key) {
  const light = torchLights.get(key);
  if (!light) return;
  scene.remove(light);
  light.traverse(function (o) { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } });
  torchLights.delete(key);
}
function rescanTorches() {
  const px = Math.floor(player.pos.x), py = Math.floor(player.pos.y), pz = Math.floor(player.pos.z);
  const R = 30;
  const nearby = [];
  for (let x = px - R; x <= px + R; x++) {
    for (let z = pz - R; z <= pz + R; z++) {
      for (let y = Math.max(1, py - 20); y <= Math.min(WORLD_H - 1, py + 20); y++) {
        if (getBlock(x, y, z) === 21) {
          const d = (x - px) * (x - px) + (y - py) * (y - py) + (z - pz) * (z - pz);
          nearby.push({ x, y, z, d });
        }
      }
    }
  }
  nearby.sort((a, b) => a.d - b.d);
  const wanted = new Set();
  for (let i = 0; i < Math.min(8, nearby.length); i++) {
    const t = nearby[i];
    const key = t.x + ',' + t.y + ',' + t.z;
    wanted.add(key);
    if (!torchLights.has(key)) addTorchLight(t.x, t.y, t.z);
  }
  for (const key of Array.from(torchLights.keys())) if (!wanted.has(key)) removeTorchLight(key);
}
setInterval(rescanTorches, 500);

// Bed and torch placement
addEventListener('mousedown', function (e) {
  if (document.pointerLockElement !== renderer.domElement) return;
  if (e.button !== 2) return;
  const slot = inventory[selectedSlot];
  if (!slot) return;
  const item = slot.item;
  if (item !== 'bed' && item !== 'torch') return;

  const result = pickBlock();
  if (!result) return;
  const px = result.place.x, py = result.place.y, pz = result.place.z;
  if (getBlock(px, py, pz) !== 0) return;

  if (item === 'bed') {
    setBlock(px, py, pz, 20);
    rebuildChunksAround(px, py, pz);
    bedSpawnPoint = { x: px + 0.5, y: py + 1, z: pz + 0.5 };
    try { localStorage.setItem(SPAWN_KEY, JSON.stringify(bedSpawnPoint)); } catch (err) {}
    toast('Bed placed');
  } else {
    setBlock(px, py, pz, 21);
    rebuildChunksAround(px, py, pz);
    addTorchLight(px, py, pz);
    toast('Torch placed');
  }
  slot.count -= 1;
  if (slot.count <= 0) inventory[selectedSlot] = null;
  refreshHotbarUI();
});

// Sleep in bed
addEventListener('mousedown', function (e) {
  if (document.pointerLockElement !== renderer.domElement) return;
  if (e.button !== 2) return;
    const foodSlot = inventory[selectedSlot];
  if (foodSlot && isFood(foodSlot.item)) {
    eatFood(foodSlot.item);
    return;
  }
  const slot = inventory[selectedSlot];
  if (slot && (slot.item === 'bed' || slot.item === 'torch')) return;
  const result = pickBlock();
  if (!result) return;
  const b = getBlock(result.hit.x, result.hit.y, result.hit.z);
  if (b !== 20) return;
  let sunY = 0;
  scene.traverse(function (o) { if (o.isDirectionalLight && sunY === 0) sunY = o.position.y; });
  if (sunY > 20) { toast('You can only sleep at night'); return; }
  bedSpawnPoint = { x: result.hit.x + 0.5, y: result.hit.y + 1, z: result.hit.z + 0.5 };
  try { localStorage.setItem(SPAWN_KEY, JSON.stringify(bedSpawnPoint)); } catch (e) {}
  toast('Spawn point set');
});

// ============================================================
// DAY / NIGHT
// ============================================================
const DAY_LENGTH = 120;
const skyDay = new THREE.Color(0x87ceeb);
const skySunset = new THREE.Color(0xff8a50);
const skyNight = new THREE.Color(0x0a1230);
let dayT = 0.5;

// ============================================================
// SAVE / LOAD
// ============================================================
const SAVE_KEY = 'miniterra3d.save.v2';
const INV_KEY = 'miniterra3d.inventory.v2';

function rleEncode(arr) {
  const out = [];
  let i = 0;
  while (i < arr.length) {
    const b = arr[i];
    let run = 1;
    while (i + run < arr.length && arr[i + run] === b && run < 65000) run++;
    out.push(b);
    out.push(run & 0xFF, (run >> 8) & 0xFF);
    i += run;
  }
  const bytes = new Uint8Array(out);
  let bin = '';
  for (let j = 0; j < bytes.length; j += 0x8000) {
    bin += String.fromCharCode.apply(null, bytes.subarray(j, j + 0x8000));
  }
  return btoa(bin);
}
function rleDecode(str, target) {
  const bin = atob(str);
  let out = 0;
  for (let i = 0; i < bin.length; i += 3) {
    const b = bin.charCodeAt(i);
    const run = bin.charCodeAt(i + 1) | (bin.charCodeAt(i + 2) << 8);
    for (let r = 0; r < run; r++) target[out++] = b;
  }
  return out;
}
function saveWorld() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: 2, seed,
      player: { x: player.pos.x, y: player.pos.y, z: player.pos.z, yaw: player.yaw, pitch: player.pitch },
      data: rleEncode(world),
    }));
    localStorage.setItem(INV_KEY, JSON.stringify(inventory));
    toast('Saved');
  } catch (e) { toast('Save failed: ' + e.message); }
}
function loadWorld() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) { toast('No save found'); return; }
    const data = JSON.parse(raw);
    if (data.seed !== undefined) seed = data.seed;
    if (data.data) rleDecode(data.data, world);
    if (data.player) {
      player.pos.set(data.player.x, data.player.y, data.player.z);
      player.yaw = data.player.yaw || 0;
      player.pitch = data.player.pitch || 0;
      player.vel.set(0, 0, 0);
    }
    const invRaw = localStorage.getItem(INV_KEY);
    if (invRaw) {
      const arr = JSON.parse(invRaw);
      if (Array.isArray(arr) && arr.length === INV_SIZE) {
        for (let i = 0; i < INV_SIZE; i++) inventory[i] = arr[i];
      }
    }
    rebuildAllChunks();
    refreshHotbarUI();
    toast('Loaded');
  } catch (e) { toast('Load failed: ' + e.message); }
}
addEventListener('keydown', function (e) {
  if (e.ctrlKey || e.metaKey) return;
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'KeyO') saveWorld();
  if (e.code === 'KeyP') loadWorld();
});
addEventListener('beforeunload', function () {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: 2, seed,
      player: { x: player.pos.x, y: player.pos.y, z: player.pos.z, yaw: player.yaw, pitch: player.pitch },
      data: rleEncode(world),
    }));
    localStorage.setItem(INV_KEY, JSON.stringify(inventory));
  } catch (e) {}
});

// ============================================================
// BLOCK HIGHLIGHT
// ============================================================
const highlightBox = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(1.002, 1.002, 1.002)),
  new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 })
);
highlightBox.visible = false;
scene.add(highlightBox);

// ============================================================
// TEXTURE PREVIEW (T key)
// ============================================================
(function () {
  const overlay = document.createElement('div');
  overlay.id = 'tex-preview';
  overlay.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);' +
    'background:#1a1d24;border:3px solid #555c6e;border-radius:8px;padding:16px;' +
    'display:none;z-index:60;color:#fff;font-family:system-ui,sans-serif;';
  const cv = document.createElement('canvas');
  cv.width = ATLAS_W; cv.height = ATLAS_H;
  cv.style.cssText = 'image-rendering:pixelated;width:' + (ATLAS_W * 3) + 'px;height:' + (ATLAS_H * 3) + 'px;display:block;';
  cv.getContext('2d').drawImage(atlasCanvas, 0, 0);
  overlay.appendChild(cv);
  const legend = document.createElement('div');
  legend.style.cssText = 'margin-top:10px;font-size:12px;color:#bbb;';
  legend.textContent = 'Press T to close · 1 tile = 1 block';
  overlay.appendChild(legend);
  document.body.appendChild(overlay);
  let visible = false;
  addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT') return;
    if (e.key !== 't' && e.key !== 'T') return;
    if (e.ctrlKey || e.metaKey) return;
    visible = !visible;
    overlay.style.display = visible ? 'block' : 'none';
  });
})();

let frame = 0;

// ============================================================
// MAIN LOOP
// ============================================================
let lastT = performance.now();
function loop() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  frame++;

  // Day/night
  dayT = (dayT + dt / DAY_LENGTH) % 1;
  const angle = (dayT - 0.25) * Math.PI * 2;
  const sunY = Math.sin(angle), sunX = Math.cos(angle);
  sun.position.set(sunX * 200, sunY * 200, 100);
  sun.intensity = Math.max(0, sunY) * 1.0;
  ambientLight.intensity = 0.3 + Math.max(0, sunY) * 0.4;
  const dayFactor = Math.max(0, Math.min(1, (sunY + 0.3) / 1.3));
  const sunsetFactor = Math.max(0, 1 - Math.abs(sunY) * 3);
  const c = new THREE.Color();
  c.lerpColors(skyNight, skyDay, dayFactor);
  c.lerp(skySunset, sunsetFactor * 0.5);
  scene.background = c;

  if (!invOpen) {
    updatePhysics(dt);
    updateStats(dt);
    updateDamageNumbers(dt);
    updateBloodParticles(dt);
    updateHitMarker(dt);
    
    if (stats.attackCooldown > 0) stats.attackCooldown -= 1;

    // Spawn mobs
    spawnCounter++;
    if (spawnCounter > 60) { spawnCounter = 0; trySpawn(); }

    // Update mobs
    for (let i = activeMobs.length - 1; i >= 0; i--) {
      const m = activeMobs[i];
      if (Math.hypot(m.pos.x - player.pos.x, m.pos.z - player.pos.z) > DESPAWN_DIST) {
        removeMob(m); continue;
      }
      updateMob(m, dt);
    }
    updateArrows(dt);
  }

  camera.position.set(player.pos.x, player.pos.y + player.height * 0.9, player.pos.z);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;

  // Block highlight
  const result = pickBlock();
  if (result && document.pointerLockElement === renderer.domElement) {
    highlightBox.position.set(result.hit.x + 0.5, result.hit.y + 0.5, result.hit.z + 0.5);
    highlightBox.visible = true;
  } else {
    highlightBox.visible = false;
  }

  const pi = document.getElementById('posinfo');
  if (pi) pi.textContent = Math.floor(player.pos.x) + ',' + Math.floor(player.pos.y) + ',' + Math.floor(player.pos.z);

  drawDamageNumbers();
  drawBloodParticles();
  drawHitMarker();
  drawStatsHUD();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// ============================================================
// STARTUP
// ============================================================
console.log('[MiniTerra 3D] generating world...');
generateWorld();
console.log('[MiniTerra 3D] building chunks...');
rebuildAllChunks();
refreshHotbarUI();
console.log('[MiniTerra 3D] ready.');
loop();
</script>
